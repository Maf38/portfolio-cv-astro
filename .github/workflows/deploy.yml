name: Deploy to GitHub Pages

# Publishes:
#   main               → GitHub Pages /portfolio-cv-astro/ and Cloudflare Pages project
#                        "mafalgai" (custom domain mafalgai.com, served at root)
#   design/machinerie  → GitHub Pages /portfolio-cv-astro/machinerie/
on:
  push:
    branches: [main, 'design/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: design/machinerie
          path: machinerie
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium (résumé PDF generation)
        working-directory: main
        run: npm ci && npx playwright install --with-deps chromium
      - name: Build main
        working-directory: main
        run: npm run check && npm run build
      - name: Build design/machinerie
        if: hashFiles('machinerie/package.json') != ''
        working-directory: machinerie
        env:
          BASE_PATH: /portfolio-cv-astro/machinerie
        run: npm ci && npm run check && npm run build
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r main/dist/. site/
          if [ -d machinerie/dist ]; then mkdir -p site/machinerie && cp -r machinerie/dist/. site/machinerie/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  cloudflare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Build for mafalgai.com (root)
        env:
          BASE_PATH: /
          SITE_URL: https://mafalgai.com
        run: npm run build
      - name: Ensure Pages project exists
        run: npx wrangler@4 pages project create mafalgai --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy dist --project-name=mafalgai --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
