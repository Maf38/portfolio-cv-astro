name: Deploy to GitHub Pages

# Publishes two design variants side by side:
#   main               → /portfolio-cv-astro/
#   design/machinerie  → /portfolio-cv-astro/machinerie/
on:
  push:
    branches: [main, 'design/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: design/machinerie
          path: machinerie
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium (résumé PDF generation)
        working-directory: main
        run: npm ci && npx playwright install --with-deps chromium
      - name: Build main
        working-directory: main
        run: npm run check && npm run build
      - name: Build design/machinerie
        if: hashFiles('machinerie/package.json') != ''
        working-directory: machinerie
        env:
          BASE_PATH: /portfolio-cv-astro/machinerie
        run: npm ci && npm run check && npm run build
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r main/dist/. site/
          if [ -d machinerie/dist ]; then mkdir -p site/machinerie && cp -r machinerie/dist/. site/machinerie/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
